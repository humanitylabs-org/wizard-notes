<!doctype html>
<html lang="en" data-app="wizard-notes" data-color-scheme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><title>Wizard Notes</title><script src="./boot.js"></script><link rel="stylesheet" href="./wizard-ui.css"><link rel="stylesheet" href="./styles.css"></head><body>
<main id="app" class="wz-app no-note">
 <button id="backdrop" aria-label="Close file explorer" hidden></button>
 <aside id="sidebar" aria-label="File explorer"><div id="tree" role="tree" aria-label="Vault folders and notes"></div><div class="vault-tools"><button id="add" aria-label="New note"></button><button id="add-folder" aria-label="New folder"></button><button id="sort" aria-label="Sort by modified" title="Sort by modified"></button><button id="collapse" aria-label="Collapse all folders"></button><button id="find" aria-label="Find notes"></button></div><footer class="vault-footer"><div><strong>Wizard Notes</strong><small id="vault-count"></small></div><button id="vault-menu" aria-label="Vault options"></button></footer></aside>
 <section id="main"><nav id="canvas-tools"><button id="back" aria-label="Toggle file explorer"></button><div id="note-controls" hidden><button id="mode" aria-label="Edit note"></button><button id="note-menu" aria-label="Note actions"></button></div></nav>
 <section id="note" hidden><header class="note-head"><input id="title" maxlength="150" aria-label="Note title" autocomplete="off"><button id="save" aria-live="polite" title="Retry saving" hidden></button></header><div class="reading-column"><div id="source" aria-label="Markdown source"></div><article id="read" tabindex="0" aria-label="Note text"></article><section id="backlinks"></section></div></section>
 <section id="search" hidden><div class="search-head"><input id="query" aria-label="Search notes" placeholder="Find a thought, a phrase, a note…" autocomplete="off"><button id="close-search" aria-label="Close search">✕</button></div><div id="search-label" class="section-label">Recent notes</div><div id="results"></div></section>
 </section><nav id="formatting" aria-label="Formatting" hidden></nav><div id="notice" role="status" aria-live="polite"></div>
</main><dialog id="sheet"><header><h2 id="sheet-title"></h2><button id="close-sheet" aria-label="Close dialog">✕</button></header><div id="sheet-body"></div></dialog>
<script src="/wizard-os-home/core/app-client.js"></script><script type="module" src="./app.js"></script></body></html>
