services:
  wizard-notes:
    image: ghcr.io/humanitylabs-org/wizard-notes:0.1.0-alpha.15
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ['no-new-privileges:true']
    mem_limit: 128m
    read_only: true
    tmpfs: [/tmp]
    environment:
      PORT: '8799'
      DATA_DIR: /data
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      # Vault folder app setting (notes#58); when set, Notes opens it instead of its own vault.
      NOTES_VAULT_FOLDER: ${NOTES_VAULT_FOLDER:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${NOTES_VAULT_FOLDER:-${APP_DATA_DIR}/data/vault}:/vault
    x-runtipi:
      is_main: true
      internal_port: 8799
x-runtipi:
  schema_version: 2
  overrides: []
